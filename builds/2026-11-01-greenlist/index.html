<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14161a">
<title>GREENLIST - Ministry of Provenance, 2031</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="brand">GREEN<span>LIST</span></div>
    <div id="nightlabel"></div>
    <div id="swaps" aria-label="swaps used"></div>
    <button id="mute" class="icon" aria-label="Mute sound" title="Sound on/off">&#9835;</button>
  </header>

  <main id="play">
    <div id="dispatchwrap">
      <div id="dispatch" aria-live="polite"></div>
      <div id="scanline" hidden></div>
      <div id="stamp" hidden></div>
    </div>
    <div id="sampler" hidden></div>

    <section id="meters">
      <canvas id="gauge" height="104"></canvas>
      <div class="bars">
        <div class="barrow"><label>READS HUMAN <small id="pplval"></small></label>
          <div class="bar"><i id="pplbar"></i><b id="pplcap"></b></div></div>
      </div>
    </section>

    <section id="actions">
      <button id="btn-reset" class="ghost">RESET</button>
      <button id="btn-scan" class="ghost" hidden>SCAN</button>
      <button id="btn-submit" class="primary">SUBMIT</button>
    </section>

    <section id="sheet" hidden>
      <div class="sheethead"><span id="sheettitle"></span><button id="sheetclose" class="icon" aria-label="Close">&times;</button></div>
      <div id="options"></div>
    </section>
  </main>

  <div id="overlay" hidden><div class="card" id="card"></div></div>
  <div id="toast" hidden></div>
</div>
<script src="wm.js"></script>
<script src="nights.js"></script>
<script src="game.js"></script>
</body>
</html>
