<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1114">
<title>Local Only - free your devices before the cloud dies</title>
<meta name="description" content="A protocol reverse-engineering puzzle: sniff a vendor's device frames, build a dissector, forge your own packets before the cloud shuts down at midnight.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="top">
  <div class="brand" aria-label="Local Only">LOCAL<b>ONLY</b></div>
  <div id="clockbox"><span id="clock">Fri 13 Nov 19:00</span><span id="cloudline"></span></div>
  <div class="topbtns">
    <button id="btnLevels" type="button">Levels</button>
    <button id="btnMute" type="button" aria-label="Mute sound">Sound on</button>
  </div>
</header>

<main id="main">
  <section id="pDevice" class="panel">
    <div class="lvlhead"><div id="lvlNum"></div><h2 id="lvlTitle"></h2><p id="lvlSub"></p></div>
    <div class="benchwrap"><canvas id="bench" width="640" height="400" aria-label="The device on your bench"></canvas></div>
    <div class="appbox">
      <div class="apphead"><span>AirLux app</span><small id="appNote">works until midnight</small></div>
      <div id="appBtns"></div>
    </div>
    <div id="goals" class="box"></div>
    <div id="walk" class="box"></div>
    <div id="notebook" class="box"></div>
  </section>

  <section id="pWire" class="panel">
    <div class="sechead"><h3>Sniffer</h3>
      <div class="tools">
        <label><input type="checkbox" id="optReplies" checked> replies</label>
        <label><input type="checkbox" id="optDiff"> diff vs selected</label>
      </div>
    </div>
    <div id="totals"></div>
    <div id="caps" aria-live="polite"></div>
    <div id="inspect" class="box"></div>
    <div class="sechead"><h3>Your dissector</h3><div class="tools" id="disTools"></div></div>
    <div id="dis"></div>
  </section>

  <section id="pForge" class="panel">
    <div class="sechead"><h3>Forge</h3><div class="tools"><label><input type="checkbox" id="optRaw"> raw hex</label></div></div>
    <div id="forge"></div>
    <div class="sechead"><h3>Device console</h3></div>
    <div id="console" role="log"></div>
  </section>
</main>

<nav id="tabs" aria-label="Panels">
  <button type="button" data-tab="pDevice" class="on">Device</button>
  <button type="button" data-tab="pWire">Wire <span id="tabBadge"></span></button>
  <button type="button" data-tab="pForge">Forge</button>
</nav>

<div id="overlay" hidden><div id="card" role="dialog" aria-modal="true"></div></div>
<div id="toast" role="status"></div>

<script src="proto.js"></script>
<script src="audio.js"></script>
<script src="bench.js"></script>
<script src="game.js"></script>
</body>
</html>
